name: Publish MuJian preview
on:
  push:
    branches: [main]
    paths:
      - 'mujian-preview.zip'
      - 'mujian-preview.zip.zip'
      - '.github/workflows/pages.yml'
      - 'theme-green.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract prototype
        run: |
          archive="mujian-preview.zip"
          if [ ! -f "$archive" ]; then archive="mujian-preview.zip.zip"; fi
          test -f "$archive" || { echo "Prototype ZIP missing"; exit 1; }
          mkdir -p _site
          unzip -q "$archive" -d _unpacked
          entry=$(find _unpacked -type f -name index.html -print -quit)
          test -n "$entry" || { echo "No index.html in zip"; exit 1; }
          root=$(dirname "$entry")
          cp -a "$root"/. _site/
          cp theme-green.css _site/theme-green.css
          sed -i 's#</head>#<link rel="stylesheet" href="theme-green.css"></head>#' _site/index.html
          sed -i "s/mujian-theme-v02/mujian-theme-v03/g" _site/app.js
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
